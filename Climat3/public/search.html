<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLIMAT3 - Database Information</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body {
            font-family: 'Mulish', sans-serif;
            background-color: #f8f9fa;
            color: #343a40;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #dee2e6;
        }
        th {
            background-color: #343a40;
            color: #fff;
        }
        .navbar {
            background-color: #343a40;
        }
        .navbar-brand {
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
        }
        .navbar-nav .nav-link {
            color: #fff;
            font-weight: bold;
        }
        .footer {
            background-color: #343a40;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
        
    </style>
</head>
<body>
   <!-- Navbar -->
  <header class="bg-dark py-3">
    <div class="container">
      <div class="row align-items-center justify-content-between">
        <div class="col-md-3">
          <a href="index.html" class="text-decoration-none text-white">
            <h2 class="fw-bold">CLIMAT3</h2>
          </a>
        </div>
        <div class="col-md-9">
          <nav class="nav justify-content-end">
            <a class="nav-link active" href="about.html">About</a>
            <a class="nav-link active" href="https://www.zotero.org/groups/5185450/climate_climate_literature_index_for_multidisciplinary_author_teams_-_training_database/library">Read</a>
            <a class="nav-link active" href="#">Download Scraper</a>
            <a class="nav-link active" href="upload.html">Upload</a>
          </nav>
        </div>
      </div>
    </div>
  </header>
  <!-- End Navbar -->

    <div class="container mt-5">
        <h2 class="text-center mb-4">Database Information</h2>
        <!-- Search Bar -->
        <div class="input-group mb-3">
            <input type="text" class="form-control" placeholder="Search by Title or Author" aria-label="Search" aria-describedby="search-button">
            <button class="btn btn-outline-secondary" type="button" id="search-button">Search</button>
        </div>
        <!-- End Search Bar -->

        <!-- Filters -->
        <div class="row mb-3">
            <div class="col-md-6">
                <label for="results-per-page">Results Per Page:</label>
                <select class="form-control" id="results-per-page">
                    <option value="20">20</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
            </div>
            <div class="col-md-6">
                <label for="sort-by-tag">Sort By Tag:</label>
                <select class="form-control" id="sort-by-tag">
                    <option value="All">All</option>
                    <option value="Biopyhsical-Distal">Biopyhsical-Distal</option>
                    <option value="Biophysical-Intermediate">Biophysical-Intermediate</option>
                    <option value="Biophysical-Micro">Biophysical-Micro</option>
                    <option value="Biophysical-Proximal">Biophysical-Proximal</option>
                    <option value="Psychological-Distal">Psychological-Distal</option>
                    <option value="Psychological-Intermediate">Psychological-Intermediate</option>
                    <option value="Psychological-Micro">Psychological-Micro</option>
                    <option value="Psychological-Proximal">Psychological-Proximal</option>
                    <option value="Social-Distal">Social-Distal</option>
                    <option value="Social-Intermediate">Social-Intermediate</option>
                    <option value="Social-Micro">Social-Micro</option>
                    <option value="Social-Proximal">Social-Proximal</option>
                </select>
            </div>
        </div>
        <!-- End Filters -->

        <!-- Table -->
        <table id="article-table">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Year</th>
                    <th>Pages</th>
                </tr>
            </thead>
            <tbody>
                <!-- Articles will be dynamically added here -->
            </tbody>
        </table>
        <!-- End Table -->
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 CLIMAT3. All Rights Reserved.</p>
        </div>
    </footer>
    <!-- End Footer -->

    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
