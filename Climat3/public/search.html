<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLIMAT3</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    
    <!-- Custom styles -->
    <link rel="stylesheet" href="styles.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

</head>
<body>
  
  <!-- Navbar -->
  <header class="bg-dark py-3">
    <div class="container">
      <div class="row align-items-center justify-content-between">
        <div class="col-md-3">
          <a href="index.html" class="text-decoration-none text-white">
            <img src="./Climat3.png" class="img-fluid" alt="Header Image" height="100" width="100">
          </a>
        </div>
            <div class="col-md-9">
            <nav class="nav justify-content-end">
                <a class="nav-link active" href="search.html">Search</a>
                <a class="nav-link active" href="about.html">About</a>
                <a class="nav-link active" href="https://www.zotero.org/groups/5185450/climate_climate_literature_index_for_multidisciplinary_author_teams_-_training_database/library">Zotero</a>
            </nav>
            </div>
        </div>
    </div>
  </header>
  <!-- End Navbar -->

  <!-- Main Content -->
  <div class="container mt-5">
    <h2 class="text-center mb-4">CLIMAT3 Articles</h2>
    
   <!-- Search Bar -->
<div class="input-group mb-3">
    <input type="text" class="form-control" placeholder="Search by Title or Author" id="searchText" aria-label="Search" aria-describedby="search-button">
    <div class="input-group-append">
        <button class="btn btn-outline-secondary" type="button" id="search-button">Search</button>
    </div>
</div>
<!-- End Search Bar -->

<!-- Sort By -->
<div class="form-group mt-3">
    <label for="sortBy">Sort By:</label>
    <select class="form-control" id="sortBy">
        <option value="title">Title</option>
        <option value="author">Author</option>
    </select>
</div>
<!-- End Sort By -->

    <!-- Filters -->
    <div class="row mb-3">
        <div class="col-md-6">
            <label for="results-per-page">Results Per Page:</label>
            <select class="form-control" id="resultsPerPage">
                <option value="20">20</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
        </div>
        <div class="col-md-6">
            <label for="sort-by-tag">Sort By Tag:</label>
            <select class="form-control" id="sort-by-tag">
                <option value="All">All</option>
                <option value="Biopyhisical">Biopyhisical</option>
                <option value="Psychological">Psychological</option>
                <option value="Social">Social</option>
            </select>
        </div>
    </div>
    <!-- End Filters -->

    <div class="page-navigation-buttons">
        <button class="btn btn-yellow mr-2" id="downloadArticles">Download Selected Articles</button>
    </div>
    

    <div id="output" style="margin-top: 20px; text-align: center;"></div>
</div>
<!-- End Main Content -->

 <!-- Page Navigation Buttons -->
<div class="page-navigation-buttons">
    <button class="btn btn-yellow btn-secondary" id="pageDown">Page Down</button>
    <button class="btn btn-yellow btn-secondary mr-2" id="pageUp">Page Up</button>
</div>
<!-- End Page Navigation Buttons -->


<!-- Footer -->
<footer class="footer">
    <div class="container">
        <p>&copy; 2024 CLIMAT3. All Rights Reserved.</p>
    </div>
</footer>
<!--End Footer -->

<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>

</body>
</html>
