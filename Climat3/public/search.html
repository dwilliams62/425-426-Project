<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLIMAT3 - Database Information</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body {
            font-family: 'Mulish', sans-serif;
            background-color: #f8f9fa;
            color: #343a40;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .card {
            margin-bottom: 20px; /* Increase space between cards */
            /* Make cards longer */
            padding: 20px; /* Add more padding inside cards if needed */
        }
        .card-header {
            background-color: #343a40;
            color: #fff;
        }
        .card-body {
            background-color: #fff;
        }
        .card-title {
            font-weight: bold;
        }
        .card-text {
            margin-bottom: 10px;
        }
        .footer {
            background-color: #343a40;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <header class="bg-dark py-3">
        <div class="container">
            <div class="row align-items-center justify-content-between">
                <div class="col-md-3">
                    <a href="index.html" class="text-decoration-none text-white">
                        <img src="./Climat3.png" class="img-fluid" alt="Header Image" height="100" width="100">
                    </a>
                </div>
                <div class="col-md-9">
                    <nav class="nav justify-content-end">
                        <a class="nav-link active" href="about.html">About</a>
                        <a class="nav-link active" href="https://www.zotero.org/groups/5185450/climate_climate_literature_index_for_multidisciplinary_author_teams_-_training_database/library">Read</a>
                        <a class="nav-link active" href="#">Download Scraper</a>
                        <a class="nav-link active" href="upload.html">Upload</a>
                    </nav>
                </div>
            </div>
        </div>
    </header>
    <!-- End Navbar -->

    <!-- Main Content -->
    <div class="container mt-5">
        <h2 class="text-center mb-4">Database Information</h2>
        <!-- Search Bar -->
        <div class="input-group mb-3">
            <input type="text" class="form-control" placeholder="Search by Title or Author" id="searchText" aria-label="Search" aria-describedby="search-button">
            <button class="btn btn-outline-secondary" type="button" id="search-button">Search</button>
        </div>
        <!-- End Search Bar -->

        <!-- Filters -->
        <div class="row mb-3">
            <div class="col-md-6">
                <label for="results-per-page">Results Per Page:</label>
                <select class="form-control" id="resultsPerPage">
                    <option value="20">20</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
            </div>
            <div class="col-md-6">
                <label for="sort-by-tag">Sort By Tag:</label>
                <select class="form-control" id="climateTag">
                    <option value="All">All</option>
                    <option value="Biopyhsical-Distal">Biopyhsical-Distal</option>
                    <option value="Biophysical-Intermediate">Biophysical-Intermediate</option>
                    <option value="Biophysical-Micro">Biophysical-Micro</option>
                    <option value="Biophysical-Proximal">Biophysical-Proximal</option>
                    <option value="Psychological-Distal">Psychological-Distal</option>
                    <option value="Psychological-Intermediate">Psychological-Intermediate</option>
                    <option value="Psychological-Micro">Psychological-Micro</option>
                    <option value="Psychological-Proximal">Psychological-Proximal</option>
                    <option value="Social-Distal">Social-Distal</option>
                    <option value="Social-Intermediate">Social-Intermediate</option>
                    <option value="Social-Micro">Social-Micro</option>
                    <option value="Social-Proximal">Social-Proximal</option>
                </select>
                <select id="sortBy">
                    <option value="title">Title</option>
                    <option value="author">Author</option>
                </select>
                <select id="searchBy" style="padding: 10px; border: 2px solid #ccc; border-radius: 5px; outline: none;">
                    <option value="title">Title</option>
                    <option value="author">Author</option>
                </select>
            </div>
        </div>
        <!-- End Filters -->

        <div id="output" style="margin-top: 20px; text-align: center;"></div>
    </div>
    <!-- End Main Content -->

    <footer class="footer">

    <script src="js/main.js"></script>
</body>
</html>
